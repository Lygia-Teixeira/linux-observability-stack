apiVersion: 1

# Agrupa por pasta + nome do alerta, espera 30s antes do primeiro envio e
# reenvia a cada 3h enquanto o alerta seguir ativo.
policies:
  - orgId: 1
    receiver: equipe-infra
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 3h
