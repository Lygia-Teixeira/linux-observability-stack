# Stack central (hub) de observabilidade.
# Roda no servidor de monitoramento (srv-monitor). Os servidores monitorados
# (srv-01, srv-02, ...) NAO rodam este compose: recebem apenas node_exporter +
# Alloy nativos e se conectam ao hub por tunel SSH (ver docs/arquitetura.md).
#
# Todas as portas sao publicadas SOMENTE em 127.0.0.1. Nada fica exposto na
# internet; o acesso ao Grafana e feito por tunel SSH ou por um proxy reverso
# com TLS (ver docs/decisoes-e-licoes.md).

name: monitoring

networks:
  default:
    name: monitoring_default
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-monitoring
    ipam:
      config:
        # Subnet fixa: o gateway (172.19.0.1) e o endereco onde os tuneis
        # reversos dos servidores satelite escutam. Fixar a subnet evita que
        # ela mude ao recriar a rede e quebre o scrape do Prometheus.
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: monitoring-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: monitoring-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ./node-exporter-textfile:/textfile_collector:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/textfile_collector'
    ports:
      - "127.0.0.1:9100:9100"
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  loki:
    image: grafana/loki:3.5.0
    container_name: monitoring-loki
    restart: unless-stopped
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      # Os satelites enviam logs para 127.0.0.1:3100 atraves do tunel SSH (-L).
      - "127.0.0.1:3100:3100"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          # 512M causou OOM apos alguns dias de indices acumulados.
          memory: 1024M

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: monitoring-alloy
    restart: unless-stopped
    volumes:
      - ./alloy/hub.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  grafana:
    image: grafana/grafana:13.1.1
    container_name: monitoring-grafana
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${GF_ROOT_URL:-http://localhost:3000}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_COOKIE_SECURE=${GF_COOKIE_SECURE:-false}
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_SMTP_ENABLED=${GF_SMTP_ENABLED:-false}
      - GF_SMTP_HOST=${GF_SMTP_HOST}
      - GF_SMTP_USER=${GF_SMTP_USER}
      - GF_SMTP_PASSWORD=${GF_SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${GF_SMTP_FROM_ADDRESS}
      - GF_SMTP_FROM_NAME=${GF_SMTP_FROM_NAME:-Monitoramento}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - loki
    deploy:
      resources:
        limits:
          cpus: '0.5'
          # 256M causou reinicios por OOM killer nesta versao do Grafana.
          memory: 1024M
